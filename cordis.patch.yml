- insert:
    - id: task-notify
      name: dsh-task-notify
      config:
        rules:
          enabled: true
          format: plain
          skipSubagents: true
          # 异常结束（error / interrupted / max-tokens）先等这么多毫秒再判定：
          # 期间被 dsh-auto-continue 续跑接上就不推（计入 suppressed）。0 = 立即推。
          autoContinueGraceMs: 60000
          # 你正在看这个会话（Web 页面停在它上面 + 最近有鼠标/键盘活动）就不推。
          # 没有客户端上报时照常推：CLI / headless / 没开 Web GUI 都不会因此漏通知。
          skipWhenWatching: true
          # 多久没有鼠标/键盘输入算「人不在」（毫秒），超过就照常推。
          afkAfterMs: 120000
          # 桌面提醒（只在打开着 DSH Web 页面时有效，走的不是 IM）：
          #   desktopNotice = 弹 Windows 系统原生气泡，点一下跳回并定位到那条会话
          #   titleBadge    = 标签页标题前加未读标记，看过后自动恢复
          #   sound         = none / beep / chime / custom（custom 用 soundUrl）
          desktopNotice: true
          noticeSticky: true
          titleBadge: true
          sound: beep
          soundUrl: ""
          # 每种结束原因一个开关（全开）。关掉哪种就不再推哪种；
          # 被开关拦下的轮次计到 /_task-notify/status 的 filtered。
          statuses:
            completed: true
            error: true
            aborted: true
            blocked: true
            max-tokens: true
            interrupted: true
            forked: true
          # 只给这些工作区发通知（完整 cwd 或工作区目录名）。留空 = 全部工作区都发；
          # 非空则先按工作区拦一道，被拦下的计到 /_task-notify/status 的 filteredWorkspace。
          onlyWorkspaces: []
          # 通知正文带哪些字段。全关也仍有一条首行（状态 | task-notify | 标题/工作区）。
          fields:
            title: true
            workspace: true
            reason: true
            sessionId: false
            time: false
          # 投递目标列表：一条通知扇出到全部目标。三者都取自 dsh-im：
          #   channel  = dsh-im 的渠道名（weixin / telegram / slack / email / ...）
          #   botId    = dsh-im 里的「账户」，形如 wx_<24 hex>
          #   targetId = dsh-im 里的收件目标，形如 tgt_<16 hex>
          #   enabled  = 这一条开不开；false 只是停用它，其它目标照发（按通道 + 账户粒度启停）
          # 留空 = 未绑定，跳过并计数（见 /_task-notify/status，含哪些通道有账户）。
          targets:
            - channel: weixin
              botId: ""
              targetId: ""
              enabled: true
            # - channel: telegram
            #   botId: ""
            #   targetId: ""
            #   enabled: true
          # 按工作区覆盖目标列表。键可以是完整 cwd，也可以只写工作区目录名。
          # workspaces:
          #   ziyongchajian:
          #     - channel: weixin
          #       botId: wx_0123456789abcdef01234567
          #       targetId: tgt_1a2b3c4d5e6f7890
          #   "E:/文档/deepseek-harness/default-workspace":
          #     - channel: slack
          #       botId: sl_0123456789abcdef01234567
          #       targetId: tgt_0f1e2d3c4b5a6978
